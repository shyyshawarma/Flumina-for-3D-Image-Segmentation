[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 128

[tool.pyright]
include = ["models", "source", "inference", "preprocessing", "tests", "train.py"]
exclude = ["**/__pycache__", "**/.cache", ".work", ".pytest-tmp"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
